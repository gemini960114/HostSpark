[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hostspark"
version = "0.4.1"
description = "Autonomous AI agent system bridging Telegram and the Antigravity CLI (agy)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.2",
]

[project.scripts]
hostspark = "hostspark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
